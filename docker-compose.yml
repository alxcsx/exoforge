services:
  postgres:
    image: postgres:16-alpine
    container_name: exoforge_postgres
    restart: unless-stopped
    # Every extension connects as its own role with its own pool (pool size + 2 connections at most), so the
    # server needs room for all of them: roughly (extensions x (pool + 2)) plus the admin pool and headroom.
    # Sixteen extensions at the default pool of 4 is under 100; 300 leaves room to raise pools (EXOFORGE_DB_POOL_SIZE,
    # EXOFORGE_DB_POOL_SIZES="auth=8").
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: exoforge_prod
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exoforge_prod"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - exoforge-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-}
        EXOFORGE_VERSION: ${EXOFORGE_VERSION:-}
    image: exoforge:latest
    container_name: exoforge_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/exoforge_prod
      # What an unsafe change to a typed table does: `refuse` fails that extension and says where; `reset`
      # drops and rebuilds the table (its rows are lost). A development stack can set `reset`.
      EXOFORGE_SCHEMA_CHANGE_MODE: ${EXOFORGE_SCHEMA_CHANGE_MODE:-refuse}
      EXOFORGE_DB_POOL_SIZE: ${EXOFORGE_DB_POOL_SIZE:-4}
      EXOFORGE_DB_POOL_SIZES: ${EXOFORGE_DB_POOL_SIZES:-auth=8}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-exoforge_super_secret_key_base_at_least_64_bytes_long_for_dev_mode}
      LIVEVIEW_SIGNING_SALT: ${LIVEVIEW_SIGNING_SALT:-exoforge_liveview_salt_for_studio_sockets_at_least_8}
      RELEASE_COOKIE: ${RELEASE_COOKIE:-exoforge_cluster_cookie}
      PHX_HOST: localhost
      PORT: "4005"
      DASHBOARD_PORT: "4005"
      GATEWAY_PORT: "4000"
      HTTP_PORT: "4001"
      EXTENSIONS_PATH: "/app/builtin_extensions,/app/uploaded_extensions"
      UPLOADED_EXTENSIONS_PATH: "/app/uploaded_extensions"
      EXOFORGE_ADMIN_EMAIL: ${EXOFORGE_ADMIN_EMAIL:-admin}
      EXOFORGE_ADMIN_PASSWORD: ${EXOFORGE_ADMIN_PASSWORD:-admin}
    ports:
      - "4005:4005" # Game Producer & Designer Studio LiveView
      - "4000:4000" # WebSocket Gateway
      - "4001:4001" # REST API Ingress
    volumes:
      - exoforge_uploads:/app/uploaded_extensions
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4005/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - exoforge-net

volumes:
  postgres_data:
  exoforge_uploads:

networks:
  exoforge-net:
    driver: bridge
