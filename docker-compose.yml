services:
  postgres:
    image: postgres:16-alpine
    container_name: exoforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: exoforge_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exoforge_prod"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - exoforge-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: exoforge:latest
    container_name: exoforge_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/exoforge_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-exoforge_super_secret_key_base_at_least_64_bytes_long_for_dev_mode}
      LIVEVIEW_SIGNING_SALT: ${LIVEVIEW_SIGNING_SALT:-exoforge_liveview_salt_for_studio_sockets_at_least_8}
      RELEASE_COOKIE: ${RELEASE_COOKIE:-exoforge_cluster_cookie}
      PHX_HOST: localhost
      PORT: "4005"
      DASHBOARD_PORT: "4005"
      GATEWAY_PORT: "4000"
      HTTP_PORT: "4001"
      PLUGINS_PATH: "/app/plugins_elixir"
      EXOFORGE_ADMIN_EMAIL: ${EXOFORGE_ADMIN_EMAIL:-admin}
      EXOFORGE_ADMIN_PASSWORD: ${EXOFORGE_ADMIN_PASSWORD:-admin}
    ports:
      - "4005:4005" # Game Producer & Designer Studio LiveView
      - "4000:4000" # WebSocket Gateway
      - "4001:4001" # REST API Ingress
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4005/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - exoforge-net

volumes:
  postgres_data:

networks:
  exoforge-net:
    driver: bridge
