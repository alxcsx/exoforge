services:
  postgres:
    image: postgres:16-alpine
    container_name: exoforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_secret_password
      POSTGRES_DB: exoforge_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exoforge_prod"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - exoforge-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: exoforge:latest
    container_name: exoforge_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      DATABASE_URL: postgres://postgres:postgres_dev_secret_password@postgres:5432/exoforge_prod
      SECRET_KEY_BASE: 00b09f187a55239a0662d04a62e3d3e69f8a3d76b1fca7e54c5e31c4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9
      PHX_HOST: localhost
      PORT: "4005"
      DASHBOARD_PORT: "4005"
      GATEWAY_PORT: "4000"
      HTTP_PORT: "4001"
      PLUGINS_PATH: "/app/plugins_elixir"
    ports:
      - "4005:4005" # Game Producer & Designer Studio LiveView
      - "4000:4000" # WebSocket Gateway
      - "4001:4001" # REST API Ingress
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4005/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - exoforge-net

volumes:
  postgres_data:

networks:
  exoforge-net:
    driver: bridge
