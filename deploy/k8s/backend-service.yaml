apiVersion: v1
kind: Service
metadata:
  name: exoforge-service
  namespace: exoforge
  labels:
    app.kubernetes.io/name: exoforge-service
    app.kubernetes.io/part-of: exoforge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: exoforge-backend
  ports:
    - name: studio
      port: 4005
      targetPort: 4005
      protocol: TCP
    - name: websocket
      port: 4000
      targetPort: 4000
      protocol: TCP
    - name: rest-api
      port: 4001
      targetPort: 4001
      protocol: TCP
