apiVersion: v1
kind: Secret
metadata:
  name: exoforge-secrets
  namespace: exoforge
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/exoforge_prod"
  POSTGRES_PASSWORD: "postgres"
  SECRET_KEY_BASE: "exoforge_super_secret_key_base_at_least_64_bytes_long_for_dev_mode"
  RELEASE_COOKIE: "exoforge_cluster_cookie"
  EXOFORGE_ADMIN_EMAIL: "admin@exoforge.local"
  EXOFORGE_ADMIN_PASSWORD: "admin"
