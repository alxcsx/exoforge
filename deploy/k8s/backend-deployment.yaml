apiVersion: apps/v1
kind: Deployment
metadata:
  name: exoforge-backend
  namespace: exoforge
  labels:
    app.kubernetes.io/name: exoforge-backend
    app.kubernetes.io/part-of: exoforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: exoforge-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exoforge-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: exoforge
          image: exoforge:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: exoforge-config
            - secretRef:
                name: exoforge-secrets
          ports:
            - containerPort: 4005
              name: studio
              protocol: TCP
            - containerPort: 4000
              name: websocket
              protocol: TCP
            - containerPort: 4001
              name: rest-api
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4005
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4005
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
