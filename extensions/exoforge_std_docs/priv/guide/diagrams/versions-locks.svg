.g{fill:var(--exo-text-subtle,#9ca3af);font:600 10px var(--exo-font,system-ui,sans-serif);letter-spacing:.08em}
.w{stroke:var(--exo-text-subtle,#9ca3af);stroke-width:1.5;fill:none}
</style><defs><marker id="arr-lock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--exo-text-subtle,#9ca3af)"/></marker></defs><text class="g" x="20" y="26" text-anchor="start">GAME VERSIONS (CLIENTS IN THE WILD)</text><text class="g" x="435" y="26" text-anchor="middle">ONE RUNNING EXTENSION</text><text class="g" x="730" y="26" text-anchor="middle">STORED ROWS</text><rect class="b" x="20" y="50" width="200" height="56" rx="9"/><text class="t" x="120.0" y="76.0" text-anchor="middle">Game 1.2 · outdated</text><text class="s" x="120.0" y="92.0" text-anchor="middle">locks achievements 1.0.0</text><rect class="a" x="20" y="124" width="200" height="56" rx="9"/><text class="t" x="120.0" y="150.0" text-anchor="middle">Game 1.3 · live</text><text class="s" x="120.0" y="166.0" text-anchor="middle">locks achievements 1.1.0</text><rect class="b" x="20" y="198" width="200" height="56" rx="9"/><text class="t" x="120.0" y="224.0" text-anchor="middle">Game 1.4 · dev</text><text class="s" x="120.0" y="240.0" text-anchor="middle">locks achievements 1.2.0</text><rect class="a" x="330" y="100" width="210" height="100" rx="9"/><text class="t" x="435.0" y="148.0" text-anchor="middle">achievements 1.2.0</text><text class="s" x="435.0" y="164.0" text-anchor="middle">one process, always the latest</text><path class="w" d="M220 78 L300 78 L300 130 L330 130" marker-end="url(#arr-lock)"/><path class="w" d="M220 152 L330 152" marker-end="url(#arr-lock)"/><text class="l" x="275" y="143" text-anchor="middle">FromVersion</text><path class="w" d="M220 226 L300 226 L300 175 L330 175" marker-end="url(#arr-lock)"/><rect class="b" x="640" y="50" width="180" height="40" rx="9"/><text class="t" x="730.0" y="74.0" text-anchor="middle">_v 1.0.0</text><rect class="b" x="640" y="110" width="180" height="40" rx="9"/><text class="t" x="730.0" y="134.0" text-anchor="middle">_v 1.1.0</text><rect class="a" x="640" y="170" width="180" height="40" rx="9"/><text class="t" x="730.0" y="194.0" text-anchor="middle">_v 1.2.0</text><path class="w" d="M540 150 L640 150" marker-end="url(#arr-lock)"/><text class="l" x="590" y="140" text-anchor="middle">reads, migrates on touch</text><text class="l" x="420" y="286" text-anchor="middle">A column is dropped only when no served game version and no row is below the migration.</text></svg>
