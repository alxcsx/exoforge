.t{fill:var(--exo-text,#111827);font:600 13px var(--exo-font,system-ui,sans-serif)}
.s{fill:var(--exo-text-muted,#6b7280);font:400 11px var(--exo-font,system-ui,sans-serif)}
.l{fill:var(--exo-text-muted,#6b7280);font:500 10.5px var(--exo-font,system-ui,sans-serif)}
.g{fill:var(--exo-text-subtle,#9ca3af);font:600 10px var(--exo-font,system-ui,sans-serif);letter-spacing:.08em}
.w{stroke:var(--exo-text-subtle,#9ca3af);stroke-width:1.5;fill:none}
</style><defs><marker id="arr-req" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--exo-text-subtle,#9ca3af)"/></marker></defs><rect class="b" x="10" y="70" width="120" height="56" rx="9"/><text class="t" x="70.0" y="96.0" text-anchor="middle">Unity client</text><text class="s" x="70.0" y="112.0" text-anchor="middle">ExoServices.X</text><rect class="b" x="180" y="70" width="130" height="56" rx="9"/><text class="t" x="245.0" y="96.0" text-anchor="middle">Transport</text><text class="s" x="245.0" y="112.0" text-anchor="middle">WebSocket or HTTP</text><rect class="a" x="360" y="70" width="150" height="56" rx="9"/><text class="t" x="435.0" y="96.0" text-anchor="middle">Dispatcher</text><text class="s" x="435.0" y="112.0" text-anchor="middle">scope check, routing</text><rect class="b" x="560" y="70" width="140" height="56" rx="9"/><text class="t" x="630.0" y="96.0" text-anchor="middle">Your extension</text><text class="s" x="630.0" y="112.0" text-anchor="middle">C# process, stdio</text><rect class="b" x="740" y="70" width="110" height="56" rx="9"/><text class="t" x="795.0" y="96.0" text-anchor="middle">Database</text><text class="s" x="795.0" y="112.0" text-anchor="middle">own schema</text><path class="w" d="M130 98 L180 98" marker-end="url(#arr-req)"/><path class="w" d="M310 98 L360 98" marker-end="url(#arr-req)"/><path class="w" d="M510 98 L560 98" marker-end="url(#arr-req)"/><path class="w" d="M700 98 L740 98" marker-end="url(#arr-req)"/><path class="w" d="M630 126 L630 165 L75 165 L75 126" marker-end="url(#arr-req)"/><text class="l" x="350" y="158" text-anchor="middle">events pushed back to subscribed clients</text></svg>
